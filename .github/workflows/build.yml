name: Build

on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches: [main, master]
    paths:
      - 'geox/**'
      - 'proxyx/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            geox/target
            proxyx/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('geox/Cargo.toml', 'proxyx/Cargo.toml') }}

      - run: cargo build --release
        working-directory: geox

      - run: cargo build --release
        working-directory: proxyx

      - name: Download source databases
        env:
          IP2L_TOKEN: ${{ secrets.IP2LOCATION_TOKEN }}
        run: |
          for entry in "DB11LITEBINIPV6:IP2LOCATION-LITE-DB11.IPV6.BIN" \
                       "PX12LITEBIN:IP2PROXY-LITE-PX12.BIN"; do
            code="${entry%%:*}"
            file="${entry##*:}"
            curl -fL -o "$code.zip" \
              "https://www.ip2location.com/download/?token=${IP2L_TOKEN}&file=$code"
            unzip -j "$code.zip" "$file"
            rm "$code.zip"
          done
          curl -fL -o GeoLite2-City.mmdb https://github.com/P3TERX/GeoLite.mmdb/releases/latest/download/GeoLite2-City.mmdb

      - name: Build geo.bin
        run: |
          ./geox/target/release/geox build
          ./geox/target/release/geox lookup 8.8.8.8
          ./geox/target/release/geox lookup 2606:4700::1

      - name: Build proxyx outputs
        run: |
          ./proxyx/target/release/proxyx build \
            --px12 IP2PROXY-LITE-PX12.BIN --out proxyx-out
          ls -lh proxyx-out

      - name: Build proxy.bin
        run: |
          ./proxyx/target/release/proxyx build-db \
            --px12 IP2PROXY-LITE-PX12.BIN --out proxy.bin
          ./proxyx/target/release/proxyx lookup --db proxy.bin 1.0.19.98

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(date -u +%Y%m%d-%H%M%S)"
          GEO_SIZE=$(du -h geo.bin | cut -f1)
          PROXY_SIZE=$(du -h proxy.bin | cut -f1)
          gh release create "$TAG" \
            geo.bin \
            proxy.bin \
            proxyx-out/proxy_pub.netset \
            proxyx-out/usage.buckets \
            proxyx-out/threat.buckets \
            proxyx-out/isp.tsv \
            proxyx-out/domain.tsv \
            proxyx-out/last_seen.tsv \
            proxyx-out/provider.tsv \
            proxyx-out/fraud_score.tsv \
            --title "IP2X $(date -u +'%Y-%m-%d %H:%M UTC')" \
            --notes "Automated IP2X database build.

          **geox** ($GEO_SIZE) IP → (lat, lon) at 0.001° precision
          - \`geo.bin\`

          **proxyx** ($PROXY_SIZE) IP → (isp, domain) mmap DB
          - \`proxy.bin\`

          **proxyx** plain-text IP-intelligence views from IP2PROXY LITE PX12
          - \`proxy_pub.netset\`   CIDR netset of public proxies (proxy_type == PUB)
          - \`usage.buckets\`      IP → usage  (bucketed per value)
          - \`threat.buckets\`     IP → threat (bucketed per value)
          - \`isp.tsv\`            IP → ISP            (dict + ranges)
          - \`domain.tsv\`         IP → domain         (dict + ranges)
          - \`last_seen.tsv\`      IP → last-seen days (dict + ranges)
          - \`provider.tsv\`       IP → VPN provider   (dict + ranges)
          - \`fraud_score.tsv\`    IP → fraud score    (dict + ranges)

          \`\`\`bash
          curl -L -O https://github.com/${{ github.repository }}/releases/download/${TAG}/geo.bin
          curl -L -O https://github.com/${{ github.repository }}/releases/download/${TAG}/proxy.bin
          curl -L -O https://github.com/${{ github.repository }}/releases/download/${TAG}/proxy_pub.netset
          curl -L -O https://github.com/${{ github.repository }}/releases/download/${TAG}/usage.buckets
          curl -L -O https://github.com/${{ github.repository }}/releases/download/${TAG}/threat.buckets
          curl -L -O https://github.com/${{ github.repository }}/releases/download/${TAG}/isp.tsv
          curl -L -O https://github.com/${{ github.repository }}/releases/download/${TAG}/domain.tsv
          curl -L -O https://github.com/${{ github.repository }}/releases/download/${TAG}/last_seen.tsv
          curl -L -O https://github.com/${{ github.repository }}/releases/download/${TAG}/provider.tsv
          curl -L -O https://github.com/${{ github.repository }}/releases/download/${TAG}/fraud_score.tsv
          \`\`\`"

      - name: Prune old releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --limit 100 --json tagName --jq '.[].tagName' | tail -n +6 \
            | xargs -rI{} gh release delete {} --yes --cleanup-tag
