name: Build

on:
  schedule:
    - cron: '0 0 * * 0'
  push:
    branches: [main, master]
    paths:
      - '*.py'
      - 'builder/*.py'
      - 'builder/geofeed_map.json'
      - 'builder/lists.json'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - run: pip install numpy pycountry geonamescache

      - name: Download source databases
        env:
          IP2L_TOKEN: ${{ secrets.IP2LOCATION_TOKEN }}
        run: |
          for entry in "DB11LITEBINIPV6:IP2LOCATION-LITE-DB11.IPV6.BIN" \
                       "PX12LITEBIN:IP2PROXY-LITE-PX12.BIN"; do
            code="${entry%%:*}"
            file="${entry##*:}"
            curl -fL -o "$code.zip" \
              "https://www.ip2location.com/download/?token=${IP2L_TOKEN}&file=$code"
            unzip -j "$code.zip" "$file"
            rm "$code.zip"
          done
          curl -fL -o GeoLite2-City.mmdb https://github.com/P3TERX/GeoLite.mmdb/releases/latest/download/GeoLite2-City.mmdb

      - name: Build geo.ip2x
        run: |
          python -m builder.build geo
          python ip2x.py --db geo.ip2x 8.8.8.8 2606:4700::1

      - name: Build proxy.ip2x and the text views
        run: |
          python -m builder.build proxy --views views
          python ip2x.py --db proxy.ip2x 1.0.19.98

      - name: Build geofeed.ip2x
        run: |
          python -m builder.feeds
          python -m builder.build geofeed
          python ip2x.py --db geofeed.ip2x 213.21.192.5

      - name: Build whois.ip2x
        run: |
          python -m builder.build whois
          python ip2x.py --db whois.ip2x 88.198.1.1 2a01:4f8::1

      - name: Build the list, cloud, Tor, resolver and IRR databases
        run: |
          for table in bots proxies vpn malware cloud tor resolvers irr; do
            python -m builder.build "$table"
          done
          python ip2x.py --db bots.ip2x 66.249.66.1
          python ip2x.py --db cloud.ip2x 3.5.140.1 2603:1000::1
          python ip2x.py --db irr.ip2x 1.1.1.1 8.8.8.8

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(date -u +%Y%m%d-%H%M%S)"
          sizes() { du -h "$1" | cut -f1; }
          gh release create "$TAG" \
            geo.ip2x proxy.ip2x geofeed.ip2x whois.ip2x \
            bots.ip2x proxies.ip2x vpn.ip2x malware.ip2x cloud.ip2x tor.ip2x \
            resolvers.ip2x irr.ip2x \
            views/proxy_pub.netset \
            views/usage.buckets views/threat.buckets \
            views/isp.tsv views/domain.tsv views/asn.tsv views/as_name.tsv \
            views/last_seen.tsv views/provider.tsv views/fraud_score.tsv \
            --title "IP2X $(date -u +'%Y-%m-%d %H:%M UTC')" \
            --notes "Automated IP2X database build.

          **geo.ip2x** ($(sizes geo.ip2x)) IP → (lat, lon) at 0.001°
          **proxy.ip2x** ($(sizes proxy.ip2x)) IP → proxy type, ISP, domain, usage,
          ASN, AS name, last seen, threat, provider, fraud score
          **geofeed.ip2x** ($(sizes geofeed.ip2x)) IP → country, region, city, postal,
          feed, RIR, provider, tags
          **whois.ip2x** ($(sizes whois.ip2x)) IP → netname, org, descr, country,
          status, RIR of the narrowest registry object
          **bots.ip2x** ($(sizes bots.ip2x)) IP → bot, kind, evidence
          **proxies.ip2x** ($(sizes proxies.ip2x)) IP → protocol, port, anonymity, lists
          **vpn.ip2x** ($(sizes vpn.ip2x)) IP → provider, evidence, lists
          **malware.ip2x** ($(sizes malware.ip2x)) IP → family, threat, first seen, source
          **cloud.ip2x** ($(sizes cloud.ip2x)) IP → provider, service, region, city,
          country
          **tor.ip2x** ($(sizes tor.ip2x)) IP → nickname, fingerprint, flags, first seen,
          bandwidth, platform, relays
          **resolvers.ip2x** ($(sizes resolvers.ip2x)) IP → name, software, DNSSEC,
          reliability
          **irr.ip2x** ($(sizes irr.ip2x)) IP → origin, source, maintainer of the
          narrowest route object

          Plain-text views of the PX12 data: \`proxy_pub.netset\`,
          \`usage.buckets\`, \`threat.buckets\` and the \`.tsv\` tables.

          Read any of them with \`python ip2x.py --db geo.ip2x 8.8.8.8\`."

          gh release list --limit 100 --json tagName --jq '.[].tagName' \
            | tail -n +6 | xargs -r -n1 gh release delete --yes --cleanup-tag
