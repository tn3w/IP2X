[package]
name = "geofeedx"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "geofeedx"
path = "src/main.rs"

[dependencies]
memmap2 = "0.9"
clap = { version = "4.6", features = ["derive"] }
ureq = "2.10"
flate2 = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
